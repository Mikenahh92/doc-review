<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Review Validation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",sans-serif}
body{background:#e8eaf0;color:#334;min-height:100vh}
header{background:#2f3b52;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:600}
header .sp{flex:1}
.gear{background:rgba(255,255,255,.12);border:none;color:#cdd9ee;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.gear:hover{background:rgba(255,255,255,.22)}
main{max-width:980px;margin:22px auto;padding:0 18px}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:18px;margin-bottom:18px}
h2{font-size:16px;color:#223;margin-bottom:12px}
h3{font-size:13px;color:#223;margin-bottom:8px}
.sub{color:#667;font-size:12.5px}
.up{border:2px dashed #b6bfd2;border-radius:8px;padding:14px;margin-bottom:10px;font-size:12px;color:#556;cursor:pointer}
.up:hover{border-color:#4a90d9}
.up.filled{border-style:solid;border-color:#4a90d9;background:#f0f6ff}
.up b{display:block;font-size:13px;color:#223;margin-bottom:2px}
.up input{display:none}
.btn{background:#2f6fb0;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:#3a7fc2}
.btn.ghost{background:none;color:#2f6fb0;border:1px solid #2f6fb0}
.btn.small{padding:5px 13px;font-size:12px}
.note{background:#fff8e1;border-left:3px solid #f0b429;padding:8px 10px;font-size:11px;color:#665522;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;color:#778;font-weight:600;border-bottom:1px solid #dde;padding:4px 6px}
td{border-bottom:1px solid #eef;padding:5px 6px}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#f4f8ff}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.ok{background:#e2f4e4;color:#1e7a2e}
.warn{background:#fff1d6;color:#a06b00}
.bad{background:#fde2e2;color:#b02020}
.user{background:#e8e4f8;color:#5b34b0}
.dim{color:#889}
.task{border:1px solid #dde;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.task .meta{color:#889;font-size:11px}
.prog{height:6px;background:#e4e8f0;border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:#2f6fb0}
.filters span{display:inline-block;border:1px solid #ccd;border-radius:99px;padding:2px 10px;font-size:11px;color:#556;margin:0 6px 6px 0;cursor:pointer}
.filters span.on{background:#2f6fb0;color:#fff;border-color:#2f6fb0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;margin:8px 0}
.pane{border:1px solid #dde;border-radius:8px;padding:8px;background:#fff}
.pane h5{font-size:10px;color:#778;margin-bottom:4px;text-transform:uppercase}
.pane del{background:#fdd;text-decoration:line-through}
.pane ins{background:#dfd;text-decoration:none}
.kpis{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:90px;border:1px solid #dde;border-radius:8px;padding:8px;text-align:center}
.kpi b{font-size:18px;display:block}
.kpi span{font-size:10px;color:#778}
.quote{font-style:italic;color:#556}
.runrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e5e9f2;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
.runrow:hover{background:#f4f8ff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.done{background:#1e7a2e}.dot.running{background:#2f6fb0}.dot.failed{background:#b02020}
.back{color:#2f6fb0;cursor:pointer;font-size:12.5px;display:inline-block;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:14px 0 0;border-bottom:1px solid #dde}
.tabs button{border:none;background:none;padding:8px 14px;font-size:12.5px;cursor:pointer;color:#778;font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:#2f6fb0;font-weight:600;border-bottom-color:#2f6fb0}
.label{font-size:11px;color:#778;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow-y:auto;padding:40px 16px}
.overlay.open{display:block}
.sheet{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:22px}
.setrow{padding:10px 0;border-top:1px solid #eef}
.setrow:first-of-type{border-top:0}
.setrow label{font-size:11.5px;color:#778;display:block;margin-bottom:4px}
.setrow input,.setrow select{width:100%;border:1px solid #ccd;border-radius:8px;padding:7px 10px;font-size:13px;background:#fafbfd}
.hint{font-size:11px;color:#889;margin-top:3px}
.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2f3b52;color:#fff;border-radius:10px;padding:9px 18px;font-size:13px;z-index:99}
.empty{color:#889;text-align:center;padding:30px;font-size:13px}
</style></head><body>
<header>
  <h1>Document Review Validation</h1>
  <span class="sp"></span>
  <button class="gear" onclick="openSettings()">⚙ settings</button>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);
let view="list", current=null, run=null, tab="overview", filter="all", poll=null, activity=null, showNew=false, openCommentNum=null;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
async function api(p,o){const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
function stopPoll(){clearInterval(poll);poll=null}
function goList(){view="list";current=null;run=null;openCommentNum=null;stopPoll();render();refreshList()}
async function openRun(id){view="detail";current=id;tab="overview";filter="all";openCommentNum=null;activity=null;stopPoll();await refresh();render();poll=setInterval(refresh,2000)}
async function refresh(){if(!current)return;try{
  const prevStatus=run?.status;
  run=await api("/api/runs/"+current);
  activity=(await api(`/api/runs/${current}/activity`).catch(()=>null))?.activity??activity;
  // keep the open comment detail pane stable while the user reads it; full re-render only on status change
  if(openCommentNum!=null&&tab==="verdicts"&&prevStatus===run.status)return;
  render()}catch(e){stopPoll()}}
let listRuns=[];
async function refreshList(){try{listRuns=await api("/api/runs");if(view==="list")render()}catch(e){}}
function pick(id){const el=$("#"+id);el.onclick=()=>el.querySelector("input").click();
  el.querySelector("input").onchange=()=>{const f=el.querySelector("input").files[0];
    el.classList.add("filled");el.querySelector(".meta").textContent=f?f.name+" · "+(f.size/1024).toFixed(0)+" KB ✓":"";
    el.dataset.has=f?"1":""}}
async function newRun(){
  const need=[["before","original"],["after","reviewed"],["register","comments register"]];
  for(const[id,n]of need)if(!$("#"+id).dataset.has)return toast("select the "+n+" file first");
  const b64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(",")[1]);fr.readAsDataURL(f)});
  const g=id=>$("#"+id).querySelector("input").files[0];
  $("#newMsg").textContent="uploading + pre-pass…";
  try{const j=await api("/api/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    before:{filename:g("before").name,contentB64:await b64(g("before"))},
    after:{filename:g("after").name,contentB64:await b64(g("after"))},
    register:{filename:g("register").name,contentB64:await b64(g("register"))}})});
    $("#newMsg").textContent="";showNew=false;openRun(j.runId)
  }catch(e){$("#newMsg").textContent="";toast("failed: "+e.message)}}
function render(){
  if(view==="list")return renderList();
  renderDetail();
}
async function renderList(){
  const runs=listRuns;
  $("#view").innerHTML=`
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <h2 style="margin:0;flex:1">Runs ${runs.length?`<span class="dim" style="font-weight:400;font-size:12.5px">(${runs.filter(r=>r.status==="running"||r.status==="planned").length} active · ${runs.length} total)</span>`:""}</h2>
    <button class="btn" onclick="showNew=!showNew;renderList()">＋ New run</button>
  </div>
  ${showNew?`<div class="card"><h3>Start validation run</h3>
    <div class="up" id="before"><b>📄 Original document</b><span class="meta">drop or click — .docx / .pdf / .md</span><input type="file" accept=".docx,.pdf,.md"></div>
    <div class="up" id="after"><b>📄 Reviewed document</b><span class="meta">drop or click — .docx / .pdf / .md</span><input type="file" accept=".docx,.pdf,.md"></div>
    <div class="up" id="register"><b>📊 Comments register (XLSX)</b><span class="meta">drop or click — .xlsx</span><input type="file" accept=".xlsx"></div>
    <button class="btn" onclick="newRun()">Run pre-pass &amp; plan</button>
    <span style="margin-left:10px;font-size:12px" id="newMsg"></span>
  </div>`:""}
  ${runs.map(r=>`<div class="runrow" onclick="openRun('${r.runId}')">
    <span class="dot ${r.status}"></span>
    <b>${r.runId}</b>
    <span class="dim">${r.createdAt.slice(0,16).replace("T"," ")}</span>
    <span class="dim">${r.comments} comments · ${r.tasksDone} tasks</span>
    <span style="flex:1"></span>
    ${r.verdict&&r.status==="done"?`<span class="pill ${r.verdict==="approved"?"ok":r.verdict==="needs_user_review"?"user":"bad"}">${r.verdict.replace(/_/g," ")}</span>`:`<span class="pill warn">${r.status==="running"?"in progress":r.status}</span>`}
  </div>`).join("")||`<div class="card"><div class="empty">no runs yet — start one with ＋ New run</div></div>`}`;
  if(showNew){pick("before");pick("after");pick("register")}
}
function renderDetail(){
  if(!run){$("#view").innerHTML=`<div class="card"><div class="empty">loading…</div></div>`;return}
  const running=run.status==="running"||run.status==="planned";
  const s=run.summary;
  const pill=running?`<span class="pill warn">in progress</span>`
    :run.status==="failed"?`<span class="pill bad">failed</span>`
    :run.verdict==="approved"?`<span class="pill ok">approved</span>`
    :run.verdict==="needs_user_review"?`<span class="pill user">needs user review</span>`
    :`<span class="pill bad">${run.verdict??"—"}</span>`;
  $("#view").innerHTML=`
  <span class="back" onclick="goList()">← all runs</span>
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0">${run.runId}</h2>${pill}
      <span style="flex:1"></span>
      <span class="dim" style="font-size:12px">${run.createdAt.slice(0,16).replace("T"," ")}</span>
    </div>
    <div class="sub" style="margin-top:6px">${s.docSummaryBefore} → ${s.docSummaryAfter}</div>
    <div class="sub">${run.commentCount} comments · ${s.anchoredCount} anchored · ${s.hunkCount} diff hunks · ${run.tasks.length} tasks</div>
    <div class="tabs">
      <button class="${tab==="overview"?"on":""}" onclick="tab='overview';openCommentNum=null;render()">Overview</button>
      <button class="${tab==="verdicts"?"on":""}" onclick="tab='verdicts';openCommentNum=null;render()">Verdicts</button>
      <button class="${tab==="styling"?"on":""}" onclick="tab='styling';openCommentNum=null;render()">Styling</button>
      <button class="${tab==="report"?"on":""}" onclick="tab='report';openCommentNum=null;render()">Report</button>
    </div>
  </div>
  <div id="tabbody"></div>`;
  const el=$("#tabbody");
  if(tab==="overview")el.innerHTML=htmlOverview();
  if(tab==="verdicts"){el.innerHTML=htmlVerdicts();if(openCommentNum!=null)openComment(openCommentNum);}
  if(tab==="styling")el.innerHTML=htmlStyling();
  if(tab==="report")el.innerHTML=htmlReport();
}
function htmlOverview(){
  return `<div class="card">
    ${!run.tasks.length?`<div class="task">🔄 Planner agent<span class="meta">creating verify tasks…</span><div class="prog"><i style="width:40%"></i></div></div>`:
    run.tasks.map(t=>{const p=t.scope.length?t.results.length/t.scope.length:0;
      const ic=t.status==="done"?"✅":t.status==="in_progress"?"🔄":t.status==="blocked"?"⛔":"◻";
      return `<div class="task">${ic} ${t.id} — ${t.title}<span class="meta">${t.results.length}/${t.scope.length} verdicts${t.note?" · "+t.note.slice(0,60):""}</span><div class="prog"><i style="width:${Math.round(p*100)}%"></i></div></div>`}).join("")}
    ${run.completionSummary?`<div class="note">📝 ${esc(run.completionSummary).slice(0,400)}</div>`:""}
    <div class="label">Agent activity (live)</div>
    <div style="border:1px solid #dde;border-radius:8px;padding:8px;max-height:280px;overflow-y:auto;font-size:11.5px;background:#fafbfe">
      ${(activity&&activity.length)?activity.slice(-120).map(a=>`<div style="padding:2px 0;border-bottom:1px solid #f0f2f8"><span class="dim">${a.ts.slice(11,19)}</span> <b style="color:#2f6fb0">${a.task}</b> ${a.tool}${a.args?` <span class="dim">${esc(a.args).slice(0,140)}</span>`:""}${a.reason?` <span style="color:#b02020">${esc(String(a.reason)).slice(0,120)}</span>`:""}</div>`).join(""):`<span class="dim">waiting for first agent action…</span>`}
    </div>
  </div>`;
}
function htmlVerdicts(){
  const rs=allResults();
  const counts={all:rs.length,correctly_applied:rs.filter(r=>r.verdict==="correctly_applied").length,
    incorrectly_applied:rs.filter(r=>r.verdict==="incorrectly_applied").length,
    missing:rs.filter(r=>r.verdict==="missing").length,needs_user:rs.filter(r=>r.verdict==="needs_user").length};
  const label={all:"all",correctly_applied:"✓ applied",incorrectly_applied:"✗ incorrect",missing:"◦ missing",needs_user:"? needs_user"};
  const shown=rs.filter(r=>filter==="all"||r.verdict===filter);
  return `<div class="card"><h3>Per-comment verification</h3>
    <div class="filters">${Object.keys(counts).map(k=>`<span class="${filter===k?"on":""}" onclick="filter='${k}';openCommentNum=null;render()">${label[k]} ${counts[k]}</span>`).join("")}</div>
    <table><tr><th>#</th><th>Verdict</th><th>Conf</th><th>Evidence</th></tr>
    ${shown.map(r=>`<tr class="clickable" onclick="openComment(${r.commentNumber})"><td><b>${r.commentNumber}</b></td>
      <td><span class="pill ${r.verdict==="correctly_applied"?"ok":r.verdict==="needs_user"?"user":"bad"}">${r.verdict.replace(/_/g," ")}</span></td>
      <td class="dim">${r.confidence}</td><td>${esc(r.evidence).slice(0,90)}</td></tr>`).join("")||`<tr><td colspan="4" class="dim">${rs.length?"nothing in this filter":"no verdicts yet — "+run.status}</td></tr>`}
    </table></div><div id="detail"></div>`;
}
async function openComment(num){
  openCommentNum=num;
  const d=await api(`/api/runs/${run.runId}/comments/${num}`);
  const c=d.comment,r=d.result;
  const esc2=t=>(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const diffHtml=(a,b)=>{const A=(a??"").split(/(\s+)/),B=(b??"").split(/(\s+)/);
    let p=0;while(p<A.length&&p<B.length&&A[p]===B[p])p++;
    let s=0;while(s<A.length-p&&s<B.length-p&&A[A.length-1-s]===B[B.length-1-s])s++;
    const del=esc2(A.slice(p,A.length-s).join("")),ins=esc2(B.slice(p,B.length-s).join(""));
    return esc2(A.slice(0,p).join(""))+(del?`<del>${del}</del>`:"")+(ins?`<ins>${ins}</ins>`:"")+esc2(A.slice(A.length-s).join(""))};
  const b=d.beforeText??d.hunks[0]?.beforeText??"",a=d.afterText??d.hunks[0]?.afterText??"";
  const verdictPill=r?`<span class="pill ${r.verdict==="correctly_applied"?"ok":r.verdict==="needs_user"?"user":"bad"}">${r.verdict.replace(/_/g," ")}</span>`:"";
  $("#detail").innerHTML=`
  <div class="card"><h3>Comment #${num} · ${verdictPill}</h3>
    <div class="sel" style="border:1px solid #b6bfd2;border-radius:8px;padding:10px 12px;font-size:12px;background:#fafbfd;margin:8px 0">type: ${c.commentType} · status: ${c.status} · processed: ${c.processed} · page ${c.page} · anchor: ${d.anchor?("#"+d.anchor.index+" ("+d.anchor.method+")"):"unanchored"}<br>
    <span class="quote">"${esc2(c.comment).slice(0,200)}"</span></div>
    <div class="split">
      <div class="pane"><h5>Original</h5>${b?diffHtml(b,a):'<span class="dim">no change near this anchor</span>'}</div>
      <div class="pane"><h5>Reviewed</h5>${a?diffHtml(b,a):""}</div>
    </div>
    ${r?`<div class="note">Evidence: ${esc2(r.evidence).slice(0,300)}${r.note?" · "+esc2(r.note).slice(0,150):""}</div>`:`<div class="note">no verdict yet</div>`}
  </div>`;
  $("#detail").scrollIntoView({behavior:"smooth"});
}
function htmlStyling(){
  const fs=[...(run.autoChecks??[]),...run.tasks.flatMap(t=>t.findings??[])];
  const n=sev=>fs.filter(f=>f.severity===sev).length;
  return `<div class="card"><h3>Styling validation — reviewed doc</h3>
    <div class="kpis">
      <div class="kpi"><b>${fs.length}</b><span>checked</span></div>
      <div class="kpi"><b style="color:#1e7a2e">${n("pass")}</b><span>pass</span></div>
      <div class="kpi"><b style="color:#a06b00">${n("warning")}</b><span>warnings</span></div>
      <div class="kpi"><b style="color:#b02020">${n("violation")}</b><span>violations</span></div>
    </div>
    <table><tr><th>Rule</th><th>Location</th><th>Severity</th><th>Evidence</th></tr>
    ${fs.map(f=>`<tr><td><b>${f.ruleId}</b></td><td class="dim">${f.page?"p"+f.page+(f.location?" · "+f.location:""):(f.location??"—")}</td>
      <td><span class="pill ${f.severity==="pass"?"ok":f.severity==="warning"?"warn":"bad"}">${f.severity}</span></td>
      <td>${esc(f.evidence).slice(0,90)}${f.suggestedFix?`<div class="dim">fix: ${esc(f.suggestedFix).slice(0,70)}</div>`:""}</td></tr>`).join("")||`<tr><td colspan="4" class="dim">no styling findings</td></tr>`}
    </table></div>`;
}
function htmlReport(){
  const rs=allResults(),ok=rs.filter(r=>r.verdict==="correctly_applied").length,nu=rs.filter(r=>r.verdict==="needs_user").length,prob=rs.length-ok-nu;
  const running=run.status!=="done";
  return `<div class="card"><h3>Verdict: <span style="color:${running?"#a06b00":run.verdict==="approved"?"#1e7a2e":"#b02020"}">${running?"pending — run in progress":run.verdict}</span></h3>
    <div class="kpis">
      <div class="kpi"><b>${ok}</b><span>correctly applied</span></div>
      <div class="kpi"><b style="color:#b02020">${prob}</b><span>problems found</span></div>
      <div class="kpi"><b style="color:#5b34b0">${nu}</b><span>needs user</span></div>
    </div>
    <div style="border:1px solid #b6bfd2;border-radius:8px;padding:10px 12px;font-size:12px;background:#fafbfd;margin:8px 0"><b>Escalation list</b>
      ${rs.filter(r=>r.verdict!=="correctly_applied").map(r=>`<br>· #${r.commentNumber} ${r.verdict} — ${esc(r.evidence).slice(0,110)}`).join("")||"<br>· none — all comments correctly applied"}
    </div>
    ${run.completionSummary?`<div class="note">📝 ${esc(run.completionSummary).slice(0,400)}</div>`:""}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button class="btn ghost small" onclick="window.location='/api/runs/${run.runId}/export.json'">Export JSON</button>
      <button class="btn ghost small" onclick="window.open('/api/runs/${run.runId}/report.html')">Report page</button>
    </div></div>`;
}
function allResults(){return (run?.tasks??[]).flatMap(t=>t.results)}
function esc(t){return (t??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;")}
async function openSettings(){
  const st=await api("/api/settings");
  $("#sheet").innerHTML=`
  <h2 style="font-size:17px;color:#223;margin-bottom:2px">Runtime settings</h2>
  <div class="sub" style="margin-bottom:12px">Saved to settings.json on the server. Env vars remain the fallback (air-gap friendly).</div>
  <div class="setrow"><label>Mode</label><select id="stMode">
    <option value="remote" ${st.mode==="remote"?"selected":""}>remote — OpenAI-compatible endpoint</option>
    <option value="ollama" ${st.mode==="ollama"?"selected":""}>ollama — local model server</option>
    <option value="faux" ${st.mode==="faux"?"selected":""}>faux — deterministic test mode</option></select></div>
  <div class="setrow"><label>Model</label>
    <div style="display:flex;gap:6px"><input id="stModel" list="stModels" value="${st.model||""}" style="flex:1" placeholder="model id">
    <button class="btn ghost" style="padding:5px 12px;font-size:12px" onclick="loadModels()">load models</button></div>
    <datalist id="stModels"></datalist><div class="hint" id="stModelsHint">Fetched from the endpoint's /models.</div></div>
  <div class="setrow"><label>Base URL</label><input id="stBase" value="${(st.baseUrl||"").replace(/\/\/[^@]*@/,"//")}" placeholder="http://localhost:11434/v1"></div>
  <div class="setrow"><label>API key</label><input id="stKey" type="password" placeholder="${st.hasApiKey?(st.apiKeyMasked+" (set — leave blank to keep)"):"not set (local servers often need none)"}"></div>
  <div class="setrow"><label>Parallel tasks</label><input id="stConc" type="number" min="1" max="16" value="${st.concurrency??1}"></div>
  <div class="setrow"><label>Attempts per task</label><input id="stAtt" type="number" min="1" max="10" value="${st.maxAttempts??3}"></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`;
  $("#overlay").classList.add("open");
}
async function loadModels(){const h=$("#stModelsHint");h.textContent="loading…";
  try{const r=await api("/api/settings/models");$("#stModels").innerHTML=(r.models||[]).map(m=>`<option value="${m}">`).join("");h.textContent=`${(r.models||[]).length} models — type or pick one`}
  catch(e){h.textContent="Could not load: "+e.message}}
async function saveSettings(){
  const body={mode:$("#stMode").value,model:$("#stModel").value.trim(),baseUrl:$("#stBase").value.trim(),
    concurrency:Number($("#stConc").value),maxAttempts:Number($("#stAtt").value)};
  const k=$("#stKey").value;if(k&&!k.includes("•"))body.apiKey=k;
  try{await api("/api/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){return toast("Save failed: "+e.message)}
  toast("Settings saved");closeSheet()}
function closeSheet(){$("#overlay").classList.remove("open")}
render();refreshList();setInterval(()=>{if(view==="list")refreshList()},5000);
</script></body></html>
