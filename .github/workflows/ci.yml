name: CI
on:
  push:
    branches: [master]
jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run fixtures
      - run: npm run e2e
      - name: ui-syntax
        run: |
          python3 - << 'PY'
          import re
          html = open('src/server/ui/index.html').read()
          for i,s in enumerate(re.findall(r'<script>(.*?)</script>', html, re.S)):
              open(f'/tmp/ui-{i}.js','w').write(s)
          PY
          for f in /tmp/ui-*.js; do node --check "$f"; done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mikenahh92/doc-review:latest
            ghcr.io/mikenahh92/doc-review:${{ github.sha }}
